{% extends 'admin_dashboard/base_admin.html' %}
{% load static %}

{% block title %}Edit {{ product.name }} | URBN Admin{% endblock %}
{% block page_title %}Edit Product: {{ product.sku }}{% endblock %}

{% block content %}
<form method="POST" class="card" style="max-width: 800px;">
    {% csrf_token %}
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
        <div style="grid-column: 1 / -1;">
            <label style="display:block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">Product Name</label>
            <input type="text" name="name" value="{{ product.name }}" required style="width: 100%; background: var(--bg-dark); color: white; border: 1px solid var(--border); padding: 10px; border-radius: 4px;">
        </div>
        
        <div>
            <label style="display:block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">Category</label>
            <select name="category" required style="width: 100%; background: var(--bg-dark); color: white; border: 1px solid var(--border); padding: 10px; border-radius: 4px;">
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label style="display:block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">Price (₹)</label>
            <input type="number" step="0.01" name="price" value="{{ product.price }}" required style="width: 100%; background: var(--bg-dark); color: white; border: 1px solid var(--border); padding: 10px; border-radius: 4px;">
        </div>

        <div>
            <label style="display:block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">Stock Quantity</label>
            <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" required style="width: 100%; background: var(--bg-dark); color: white; border: 1px solid var(--border); padding: 10px; border-radius: 4px;">
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 12px; justify-content: center;">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}>
                <span>Active (Visible on store)</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" name="is_trending" {% if product.is_trending %}checked{% endif %}>
                <span>Mark as Trending</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" name="is_new_arrival" {% if product.is_new_arrival %}checked{% endif %}>
                <span>Mark as New Arrival</span>
            </label>
        </div>
    </div>
    
    <div style="display: flex; gap: 16px;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'admin_products' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
