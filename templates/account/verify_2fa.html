{% extends "base.html" %}
{% load static %}

{% block title %}Verify Two-Factor Authentication - URBN{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 20px;
        position: relative;
        z-index: 2;
    }
    
    .auth-card {
        background: rgba(20, 20, 22, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .auth-title {
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 10px;
        text-align: center;
        letter-spacing: 1px;
    }
    
    .auth-subtitle {
        color: var(--text-muted);
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
        line-height: 1.5;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-control {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 14px 16px;
        color: var(--text-primary);
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        transition: all 0.3s ease;
        text-align: center;
        letter-spacing: 4px;
    }
    
    .form-control:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
    }
    
    .btn-auth {
        width: 100%;
        background: var(--text-primary);
        color: var(--bg-primary);
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        margin-top: 10px;
    }
    
    .btn-auth:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
    }
    
    #error-message {
        color: #ff5252;
        font-size: 13px;
        text-align: center;
        margin-top: 15px;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Two-Factor Authentication</h1>
        <p class="auth-subtitle">Enter the 6-digit code from your authenticator app to continue.</p>
        
        <form id="verify-2fa-form">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" id="token" class="form-control" placeholder="000000" maxlength="10" required autocomplete="off">
            </div>
            
            <button type="submit" class="btn-auth" id="verify-btn">Verify Code</button>
            <div id="error-message"></div>
        </form>
    </div>
</div>

<script>
document.getElementById('verify-2fa-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const token = document.getElementById('token').value;
    const btn = document.getElementById('verify-btn');
    const errorEl = document.getElementById('error-message');
    
    btn.disabled = true;
    btn.textContent = 'VERIFYING...';
    errorEl.style.display = 'none';
    
    try {
        const response = await fetch("{% url 'verify_2fa_login' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({ token })
        });
        
        const data = await response.json();
        
        if (data.success) {
            window.location.href = data.redirect_url;
        } else {
            errorEl.textContent = data.message;
            errorEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'VERIFY CODE';
        }
    } catch (err) {
        errorEl.textContent = 'An error occurred. Please try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'VERIFY CODE';
    }
});
</script>
{% endblock %}
