{% extends 'base.html' %}
{% block content %}
<div class="auth-container" style="max-width:400px; margin: 100px auto; padding: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; text-align:center; font-family: 'Inter', sans-serif;">
    <h2 style="margin-bottom: 20px;">Reset Password</h2>
    <p style="margin-bottom: 20px; font-size: 14px; color: #ccc;">Enter your email address and we will send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width: 100%; padding: 12px; background: white; color: black; border: none; font-weight: 600; cursor: pointer; border-radius: 6px; margin-top: 10px;">Send Reset Email</button>
    </form>
</div>
{% endblock %}
