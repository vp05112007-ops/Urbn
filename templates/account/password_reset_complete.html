{% extends 'base.html' %}
{% block content %}
<div class="auth-container" style="max-width:400px; margin: 100px auto; padding: 20px; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; text-align:center; font-family: 'Inter', sans-serif;">
    <h2 style="margin-bottom: 20px;">Password Reset Complete</h2>
    <p style="margin-bottom: 20px; font-size: 14px; color: #ccc;">Your password has been set. You may go ahead and log in now.</p>
    <a href="/profile/" style="display: block; width: 100%; padding: 12px; background: white; color: black; text-decoration: none; font-weight: 600; border-radius: 6px; box-sizing: border-box;">Go to Profile</a>
</div>
{% endblock %}
